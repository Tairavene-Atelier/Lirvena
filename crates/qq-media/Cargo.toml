[package]
name = "qq-media"
description = "QQ media handling boundary for Lirvena."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "=0.23.1"
futures-util = "=0.3.33"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "net", "process", "time"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
