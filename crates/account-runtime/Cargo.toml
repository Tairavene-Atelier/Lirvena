[package]
name = "account-runtime"
description = "Account actor and persistence boundary for Lirvena."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
local-state = { version = "=0.0.0", path = "../local-state" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "=1.53.1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
