[package]
name = "ceylith-crypto"
description = "Fixed-suite secure session shared by Ceylith and Lirvena."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ceylith-protocol = { version = "=0.0.0", path = "../ceylith-protocol" }
getrandom = "=0.4.3"
noise-protocol = "=0.2.1"
noise-rust-crypto = { version = "=0.6.2", default-features = false, features = ["use-blake2", "use-chacha20poly1305"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "=1.9.0"

[lints]
workspace = true
