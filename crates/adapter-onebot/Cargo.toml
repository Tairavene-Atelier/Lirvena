[package]
name = "adapter-onebot"
description = "OneBot adapter boundary for Lirvena."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
account-api = { version = "=0.0.0", path = "../account-api" }
account-runtime = { version = "=0.0.0", path = "../account-runtime" }
async-stream = "=0.3.6"
axum = { version = "=0.8.9", features = ["http1", "json", "tokio", "ws"] }
futures-util = "=0.3.33"
hmac = "=0.12.1"
qq-message = { version = "=0.0.0", path = "../qq-message" }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_urlencoded = "=0.7.1"
sha1 = "=0.10.7"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
