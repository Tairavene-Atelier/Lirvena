[package]
name = "ceylith-client"
description = "Public Ceylith client contract boundary for Lirvena."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ceylith-crypto = { version = "=0.0.0", path = "../ceylith-crypto" }
ceylith-protocol = { version = "=0.0.0", path = "../ceylith-protocol" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
getrandom = "=0.4.3"
prost = "=0.14.4"
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt"] }

[lints]
workspace = true
