[package]
name = "lirvena"
description = "Lirvena command-line application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
account-api = { version = "=0.0.0", path = "../../crates/account-api" }
account-message-store = { version = "=0.0.0", path = "../../crates/account-message-store" }
account-runtime = { version = "=0.0.0", path = "../../crates/account-runtime" }
adapter-onebot = { version = "=0.0.0", path = "../../crates/adapter-onebot" }
ceylith-client = { version = "=0.0.0", path = "../../crates/ceylith-client" }
ceylith-crypto = { version = "=0.0.0", path = "../../crates/ceylith-crypto" }
ceylith-protocol = { version = "=0.0.0", path = "../../crates/ceylith-protocol" }
community-telemetry = { version = "=0.0.0", path = "../../crates/community-telemetry" }
getrandom = "=0.4.3"
local-state = { version = "=0.0.0", path = "../../crates/local-state" }
notify-runtime = { version = "=0.0.0", path = "../../crates/notify-runtime" }
qq-envelope = { version = "=0.0.0", path = "../../crates/qq-envelope" }
qq-highway = { version = "=0.0.0", path = "../../crates/qq-highway" }
qq-domain = { version = "=0.0.0", path = "../../crates/qq-domain" }
qq-control = { version = "=0.0.0", path = "../../crates/qq-control" }
qq-directory = { version = "=0.0.0", path = "../../crates/qq-directory" }
qq-login = { version = "=0.0.0", path = "../../crates/qq-login" }
qq-media = { version = "=0.0.0", path = "../../crates/qq-media" }
qq-message = { version = "=0.0.0", path = "../../crates/qq-message" }
qq-online = { version = "=0.0.0", path = "../../crates/qq-online" }
qq-profile = { version = "=0.0.0", path = "../../crates/qq-profile" }
qq-session = { version = "=0.0.0", path = "../../crates/qq-session" }
qq-transport = { version = "=0.0.0", path = "../../crates/qq-transport" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "=1.9.0"

[dev-dependencies]
prost = "=0.14.4"
tempfile = "=3.27.0"

[lints]
workspace = true
